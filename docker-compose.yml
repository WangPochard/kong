version: '3.8'

services:
  kong-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hoone
      POSTGRES_PASSWORD: Hoone@83551401
      POSTGRES_DB: kong
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # host:5432 已被佔用，改用 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoone -d kong"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kong-migrations:
    image: kong:3.7.0
    command: kong migrations bootstrap
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: hoone
      KONG_PG_PASSWORD: Hoone@83551401
      KONG_PG_DATABASE: kong
    restart: on-failure

  kong:
    image: kong:3.7.0
    depends_on:
      kong-db:
        condition: service_healthy
      kong-migrations:
        condition: service_completed_successfully
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: hoone
      KONG_PG_PASSWORD: Hoone@83551401
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8765
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - "8000:8000"   # HTTP Proxy
      - "8443:8443"   # HTTPS Proxy
      - "8765:8765"   # Admin API
      - "8002:8002"   # Admin GUI (Dashboard)
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  kong-db-data:
